<article class="li">
  <header>
    <ul class="facts">
      <li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time></li>
    </ul>
    <h2 class="title"><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
  </header>
  <div class="summary">
    {{ .Summary }}
  </div>
  <footer>
    <a class="read-more" href="{{ .Permalink }}">View gallery &rarr;</a>
  </footer>
</article>
