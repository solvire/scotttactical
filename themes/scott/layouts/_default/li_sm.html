<article class="li sm">
  <header>
    <ul class="facts">
      <li><time datetime="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Lastmod.Format ( .Site.Params.dateformat | default "Jan 2, 2006") }}</time></li>
      {{ with .Section }}<li><a href="{{ $.Site.BaseURL }}{{ . | urlize }}/">{{ . }}</a></li>{{ end }}
    </ul>
    <div class="title"><a href="{{ .Permalink }}">{{ .Title }}</a></div>
  </header>
</article>
